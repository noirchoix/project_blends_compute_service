services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./state:/app/state
      - ./config:/app/config:ro
  quantum-worker:
    build: .
    command: ["project-blends-worker"]
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./state:/app/state
      - ./config:/app/config:ro
