[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-blends-compute"
version = "0.1.6"
description = "Artifact-backed identity, profile, reaction-evidence and computational chemistry service for the Project Blends study"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Blends"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "rdkit>=2024.3",
  "python-docx>=1.1",
  "duckdb>=1.0",
  "lightgbm>=4.5",
]

[project.optional-dependencies]
artifacts = ["pyarrow>=16"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
quantum = ["networkx>=3.3"]

[project.scripts]
project-blends-api = "project_blends_compute.api.main:run"
project-blends-worker = "project_blends_compute.quantum.worker:main"
project-blends-run = "project_blends_compute.cli:main"
project-blends-curate-storage = "project_blends_compute.storage_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: API and artifact contract tests",
  "integration: integration tests using temporary artifact stores",
  "slow: optional external-engine tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
project_blends_compute = ["resources/**/*.json"]
